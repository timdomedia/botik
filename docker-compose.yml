services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      # только для nginx на этом же сервере; наружу порт не торчит
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}"
    volumes:
      - ./data:/app/data
      - ./products.yaml:/app/products.yaml:ro
      - ./service_account.json:/app/service_account.json:ro
