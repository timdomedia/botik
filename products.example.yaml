# Каталог товаров. Скопируй в products.yaml и заполни.
#
# name      — как товар показывать в чате и таблице
# match     — как ещё он может называться в Тильде и в беседе (без учёта регистра).
#             Побеждает самое длинное совпадение: «зипка тайно» важнее, чем «тайно».
# price     — розничная цена 1 шт.: нужна для продаж, которые пишете в чат без суммы
#             («шуба Л долями»). Можно по размерам: {default: 25000, XL: 27000}
# cost      — себестоимость 1 шт. (пошив/закупка, упаковка…), тоже можно по размерам
# outerwear — верхняя одежда: ведём учёт по размерам в отдельной таблице
# stock     — (необязательно) сколько было на старте по размерам, чтобы считать остаток
#
# Прибыль бренда = выручка − комиссия способа оплаты − себестоимость.
# Дане уходит DANE_SHARE_PERCENT (по умолчанию 50%) от прибыли, остальное твоё.

products:
  - name: Шуба
    match: ["шуба", "шубу"]
    price: 25000
    cost: 9000
    outerwear: true
    stock: {S: 3, M: 5, L: 5, XL: 2}

  - name: Бомбер
    price: 12000
    cost: 4000
    outerwear: true

  - name: Зипка Тайно
    match: ["зипка тайно", "зип тайно", "зипку тайно"]
    price: 7000
    cost: 2500

  - name: Тайно
    price: 4500
    cost: 1500

  - name: Реквием
    price: 6000
    cost: 2000

  - name: Кружево
    price: 3000
    cost: 800

# Способы оплаты и их комиссия, %. aliases — как пишете в чате и как называется
# платёжка в Тильде (paymentsystem). Если секцию убрать, будут значения по умолчанию.
# Если в продаже из чата способ не указан, комиссия 0.
# Если у заказа с Тильды способ не распознан, берётся ACQUIRING_PERCENT из .env.
payments:
  долями:    {fee: 7,   aliases: ["долями", "долям", "dolyame"]}
  сбп:       {fee: 0.7, aliases: ["сбп", "sbp"]}
  переводом: {fee: 0,   aliases: ["перевод"]}
  налом:     {fee: 0,   aliases: ["нал", "cash"]}
  картой:    {fee: 3.5, aliases: ["карт", "tinkoff", "тинькофф", "cloudpayments", "yookassa", "юкасс"]}

# Товар не из каталога: заказ с Тильды всё равно придёт с пометкой «⚠️ нет в каталоге»
# и себестоимостью 0. Сообщения в чате с такими товарами бот просто не трогает.
