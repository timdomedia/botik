# Каталог товаров. Скопируй в products.yaml и заполни.
#
# match    — по чему узнаём товар из заказа Тильды: артикул (sku) или кусок названия
#            (без учёта регистра). Первое совпадение выигрывает.
# dane     — сколько скидываем Дане с 1 шт. (можно задать по размерам: {S: 3000, XL: 3500})
# cost     — прочая себестоимость с 1 шт. (упаковка, доставка до тебя и т.п.), можно 0
# outerwear — верхняя одежда: ведём учёт по размерам в отдельной таблице
# stock    — (необязательно) сколько было на старте по размерам, чтобы считать остаток

products:
  - name: Пуховик Arctic
    match: ["ARCTIC", "пуховик arctic"]
    dane: 4500
    cost: 300
    outerwear: true
    stock: {S: 5, M: 8, L: 8, XL: 4}

  - name: Куртка Shell
    match: ["SHELL", "куртка shell"]
    dane: {default: 3000, XL: 3300}
    cost: 200
    outerwear: true

  - name: Худи Basic
    match: ["HOODIE", "худи"]
    dane: 1200
    cost: 100
    outerwear: false

# Если товар не нашёлся в каталоге — бот всё равно пришлёт заказ,
# но пометит позицию «⚠️ нет в каталоге» и посчитает Дане 0.
