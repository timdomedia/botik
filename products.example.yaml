# Каталог товаров. Скопируй в products.yaml и заполни.
#
# match     — по чему узнаём товар из заказа Тильды: артикул (sku) или кусок названия
#             (без учёта регистра). Срабатывает первое совпадение.
# cost      — себестоимость 1 шт. (пошив/закупка, упаковка и т.п.).
#             Можно задать по размерам: {default: 5000, XL: 5400}
# outerwear — верхняя одежда: ведём учёт по размерам в отдельной таблице
# stock     — (необязательно) сколько было на старте по размерам, чтобы считать остаток
#
# Прибыль бренда = выручка − эквайринг − себестоимость.
# Дане уходит DANE_SHARE_PERCENT (по умолчанию 50%) от прибыли, остальное твоё.

products:
  - name: Пуховик Arctic
    match: ["ARCTIC", "пуховик arctic"]
    cost: 5000
    outerwear: true
    stock: {S: 5, M: 8, L: 8, XL: 4}

  - name: Куртка Shell
    match: ["SHELL", "куртка shell"]
    cost: {default: 3500, XL: 3800}
    outerwear: true

  - name: Худи Basic
    match: ["HOODIE", "худи"]
    cost: 1300
    outerwear: false

# Если товара нет в каталоге, бот всё равно пришлёт заказ, но пометит позицию
# «⚠️ нет в каталоге» и посчитает себестоимость 0, то есть прибыль будет завышена.
